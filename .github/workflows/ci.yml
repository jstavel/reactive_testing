name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The merge gate: the whole offline pipeline. No browser, no CDP, no
  # Playwright — `npm ci` is the only network step. Every step is green-only:
  # any red outcome is a real regression, never normal operation.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24 with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (the only network step)
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (biome check — same command as local npm run lint, fails on warnings)
        run: npm run lint

      - name: Lint red-path gate — the gate must fail on violations and recover via fix
        run: |
          scratch="$(mktemp -d lint-redpath.XXXXXX)"
          trap 'rm -rf "$scratch"' EXIT
          cat > "$scratch/violation.ts" <<'TS'
          import { existsSync } from "node:fs";
          const step = 1;
          if (step === 1) {
            console.log(step);
              }
          TS
          out="$scratch/check.out"
          if npx biome check --error-on-warnings "$scratch" >"$out" 2>&1; then
            echo "::error::lint red-path gate failed: biome check --error-on-warnings exited 0 on a deliberately violated file — the gate cannot fail"
            cat "$out"
            exit 1
          fi
          if ! grep -qF 'violation.ts' "$out"; then
            echo "::error::lint red-path gate failed: the violation output does not name the offending file"
            cat "$out"
            exit 1
          fi
          if ! npx biome check --write --unsafe "$scratch" >"$out" 2>&1; then
            echo "::error::lint red-path gate failed: biome check --write could not repair the violation (unused-import removal is an unsafe-class fix)"
            cat "$out"
            exit 1
          fi
          if ! npx biome check --error-on-warnings "$scratch" >"$out" 2>&1; then
            echo "::error::lint red-path gate failed: the repaired file still fails the gate"
            cat "$out"
            exit 1
          fi
          echo "lint red-path gate OK — violation named and failed the gate, fix flow recovered"

      - name: Unit tests (vitest run — offline, no browser)
        run: npm test

      - name: Vitest JSON summary → tests.json (live badge feed; fails loudly when the counts are missing)
        run: |
          npx vitest run --reporter=json --outputFile=vitest-summary.json
          npx tsx bin/tests-summary.ts vitest-summary.json tests.json

      - name: Upload the tests summary (the badge feed the pages job stages as _site/tests.json)
        uses: actions/upload-artifact@v4
        with:
          name: tests-summary
          path: tests.json
          if-no-files-found: error
          # One day: the artifact is only needed by the same run's pages job.
          # A later pages-only re-run of an expired run fails at the download —
          # a fresh main push (or a manual dispatch) regenerates and redeploys.
          retention-days: 1

      - name: Fixture determinism gate — regenerate in place, the tree must be unchanged
        run: |
          npm run generate:sample
          git diff --exit-code -- corpus/example corpus/snapshots/example corpus/probes/example
          test -f corpus/example/report.json && test -f corpus/example/report.html && test -f corpus/example/run-manifest.json
          test -z "$(git status --porcelain -- corpus/example corpus/snapshots/example corpus/probes/example)"

      - name: Validate the committed fixture (validate:smoke — 18/18 checks, exit 0)
        run: npm run validate:smoke -- example --corpus-dir corpus

      - name: Report the committed fixture (report:smoke — 14/14 scenarios, exit 0)
        run: npm run report:smoke -- example --corpus-dir corpus

      - name: Re-assert the tree clean — the reporter rewrote the reports after the diff
        run: |
          test -z "$(git status --porcelain -- corpus/example corpus/snapshots/example corpus/probes/example)"

      - name: Fail-demo surface gate — failing evidence stays gitignored and uncommittable
        run: |
          npm run generate:sample -- --fail
          for d in corpus/fail-demo corpus/snapshots/fail-demo corpus/probes/fail-demo; do
            if ! git check-ignore -q -- "$d"; then
              echo "::error::fail-demo surface gate failed: '$d' is not gitignored — failing evidence must never become committable"
              exit 1
            fi
            echo "gitignored: $d"
          done
          tracked="$(git ls-files -- corpus/fail-demo corpus/snapshots/fail-demo corpus/probes/fail-demo)"
          if [ -n "$tracked" ]; then
            echo "::error::fail-demo surface gate failed: failing evidence is already tracked — it must never be committed"
            echo "$tracked"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- corpus/fail-demo corpus/snapshots/fail-demo corpus/probes/fail-demo)" ]; then
            echo "::error::fail-demo surface gate failed: fail-demo paths appear in git status — failing evidence must never become committable"
            git status --porcelain -- corpus/fail-demo corpus/snapshots/fail-demo corpus/probes/fail-demo
            exit 1
          fi
          if grep -Eq '^![^#]*fail-demo' .gitignore; then
            echo "::error::fail-demo surface gate failed: .gitignore re-includes fail-demo — failing evidence must never become committable"
            grep -nE '^![^#]*fail-demo' .gitignore
            exit 1
          fi
          echo "fail-demo surface gate OK — all three fail-demo roots gitignored, nothing tracked or dirty, no .gitignore negation"

  # The live sample: only after ci is green, only on a push to main (never on
  # a pull request) or a manual dispatch on main (the way to redo the deploy
  # right after enabling Pages). Stages the committed sample fixture — never
  # fail-demo — plus the ci job's tests.json badge feed, and publishes them
  # through the official Pages actions.
  pages:
    needs: ci
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # Own group, queued (never canceled) — an in-flight deploy must not be
    # killed by a superseding run; the next one waits its turn.
    concurrency:
      group: ${{ github.workflow }}-pages-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed sample fixture
        uses: actions/checkout@v4

      - name: Stage the committed sample fixture into _site/corpus/… (fail-demo never staged)
        run: |
          mkdir -p _site/corpus/example _site/corpus/snapshots/example _site/corpus/probes/example
          cp -a corpus/example/.           _site/corpus/example/
          cp -a corpus/snapshots/example/. _site/corpus/snapshots/example/
          cp -a corpus/probes/example/.    _site/corpus/probes/example/
          # Minimal root page (relative redirect) so the site root is not a 404.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>reactive-testing — sample report</title>
          <meta http-equiv="refresh" content="0; url=corpus/example/report.html">
          <p>Redirecting to the <a href="corpus/example/report.html">sample report</a>.</p>
          HTML

      - name: Download the ci job's tests summary into _site/ (staged beside the corpus dirs)
        uses: actions/download-artifact@v4
        with:
          name: tests-summary
          path: _site

      - name: Guard — the staged tests summary must be present
        run: |
          if ! test -f _site/tests.json; then
            echo "::error::pages staging guard failed: the tests-summary artifact did not land as _site/tests.json — the badge feed would 404"
            exit 1
          fi
          echo "staged badge feed: $(cat _site/tests.json)"

      - name: Guard — the staged site must not contain fail-demo
        run: |
          if [ -n "$(find _site -name '*fail-demo*' -print -quit)" ]; then
            echo "::error::pages staging guard failed: fail-demo paths staged — refusing to publish failing evidence"
            find _site -name '*fail-demo*'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the deployed report is live (report.v1 schema)
        run: |
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors \
            "${{ steps.deployment.outputs.page_url }}corpus/example/report.json" \
            | jq -e '.schema == "report.v1"'

      - name: Verify the deployed tests summary is live (badge feed — numbers, passed == total)
        run: |
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors \
            "${{ steps.deployment.outputs.page_url }}tests.json" \
            | jq -e '(.passed | type) == "number" and (.total | type) == "number" and .passed == .total'
